[build]
  command = "python3 tools/publish_site.py"
  publish = "dist"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/generated/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
